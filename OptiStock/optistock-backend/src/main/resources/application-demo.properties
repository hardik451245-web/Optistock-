# Demo Profile Configuration: in-memory MySQL-compatible database for standalone demonstration
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=jdbc:h2:mem:optistock;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

optistock.discount.min-margin-percent=10
