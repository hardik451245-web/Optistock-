spring.application.name=optistock
server.port=8080

# Database Configuration (MySQL)
# Password and secrets externalized to environment variables per security best practices
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/optistock?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# OptiStock Discount Rules
optistock.discount.min-margin-percent=10
