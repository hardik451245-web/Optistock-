services:
  # OptiStock AI - Backend Web Service
  - type: web
    name: optistock-backend
    env: docker
    dockerfilePath: OptiStock/optistock-backend/Dockerfile
    dockerContext: OptiStock/optistock-backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: optistock-db
          property: connectionString
      - key: OPTISTOCK_MANAGER_CODE
        value: OPTISTOCK-MGR-2026
      - key: CORS_ALLOWED_ORIGINS
        value: https://optistock.vercel.app,https://*.vercel.app

databases:
  # OptiStock AI - Managed Free PostgreSQL Database
  - name: optistock-db
    plan: free
    databaseName: optistock
    user: optistock_user
